<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="628" viewBox="0 0 1200 628" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#fff" stroke-width="0.3" opacity="0.04"/>
    </pattern>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d0520"/>
      <stop offset="100%" style="stop-color:#150a2e"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7c3aed"/>
      <stop offset="100%" style="stop-color:#6366f1"/>
    </linearGradient>
    <linearGradient id="lf" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0d0520;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#0d0520;stop-opacity:0"/>
    </linearGradient>
    <linearGradient id="rf" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0d0520;stop-opacity:0"/>
      <stop offset="100%" style="stop-color:#0d0520;stop-opacity:1"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="628" fill="url(#bgGrad)"/>
  <rect width="1200" height="628" fill="url(#grid)"/>
  <rect x="0" y="0" width="1200" height="5" fill="url(#accentGrad)"/>
  <rect x="0" y="623" width="1200" height="5" fill="url(#accentGrad)"/>
  <ellipse cx="880" cy="314" rx="360" ry="260" fill="#7c3aed" opacity="0.05"/>

  <!-- Left -->
  <rect x="60" y="88" width="100" height="28" rx="14" fill="#2d1a5f" stroke="#7c3aed" stroke-width="1"/>
  <text x="110" y="107" text-anchor="middle" fill="#c4b5fd" font-size="12" font-weight="600" letter-spacing="1.5">INSIGHTS</text>

  <text x="60" y="182" fill="#faf5ff" font-size="44" font-weight="800" letter-spacing="-1">Multi-Tenant Stripe</text>
  <text x="60" y="235" fill="#faf5ff" font-size="44" font-weight="800" letter-spacing="-1">Connect Payments</text>
  <text x="60" y="282" fill="#c4b5fd" font-size="28" font-weight="700">in Go SaaS</text>

  <line x1="60" y1="302" x2="460" y2="302" stroke="url(#accentGrad)" stroke-width="2" opacity="0.6"/>

  <text x="60" y="338" fill="#ddd6fe" font-size="15">Per-partner Stripe accounts · Dynamic fee calc</text>
  <text x="60" y="360" fill="#ddd6fe" font-size="15">Transfer routing · Express Connect onboarding</text>

  <rect x="60" y="390" width="80" height="28" rx="14" fill="#0d0520" stroke="#374151" stroke-width="1"/>
  <text x="100" y="409" text-anchor="middle" fill="#9ca3af" font-size="12">Go</text>
  <rect x="150" y="390" width="72" height="28" rx="14" fill="#0d0520" stroke="#374151" stroke-width="1"/>
  <text x="186" y="409" text-anchor="middle" fill="#9ca3af" font-size="12">Stripe</text>
  <rect x="232" y="390" width="90" height="28" rx="14" fill="#0d0520" stroke="#374151" stroke-width="1"/>
  <text x="277" y="409" text-anchor="middle" fill="#9ca3af" font-size="12">SaaS Multi</text>
  <rect x="332" y="390" width="100" height="28" rx="14" fill="#0d0520" stroke="#374151" stroke-width="1"/>
  <text x="382" y="409" text-anchor="middle" fill="#9ca3af" font-size="12">Webhooks</text>

  <text x="60" y="568" fill="#2d1a5f" font-size="14">northbeam-tech.com/insights</text>

  <!-- Right: payment flow -->
  <rect x="670" y="90" width="480" height="400" rx="8" fill="#0a0416" stroke="#2d1a5f" stroke-width="1.5"/>
  <rect x="670" y="90" width="480" height="36" rx="8" fill="#2d1a5f"/>
  <rect x="670" y="108" width="480" height="18" rx="0" fill="#2d1a5f"/>
  <text x="910" y="113" text-anchor="middle" fill="#c4b5fd" font-size="11" font-weight="700">Stripe Connect — Multi-Tenant Payment Flow</text>

  <!-- Platform account -->
  <rect x="700" y="140" width="420" height="44" rx="4" fill="#1a0a3d" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="910" y="158" text-anchor="middle" fill="#a78bfa" font-size="10" font-weight="700">Platform Account (Verify365 default)</text>
  <text x="910" y="174" text-anchor="middle" fill="#6b7280" font-size="9">STRIPE_SECRET · STRIPE_WEBHOOK · STRIPE_WEBHOOK_CONNECT</text>

  <!-- Partner accounts -->
  <rect x="700" y="198" width="190" height="60" rx="4" fill="#0a0416" stroke="#2d1a5f" stroke-width="1"/>
  <text x="795" y="218" text-anchor="middle" fill="#8b5cf6" font-size="9" font-weight="700">Partner A</text>
  <text x="795" y="233" text-anchor="middle" fill="#475569" font-size="8">partner.StripeSecret</text>
  <text x="795" y="248" text-anchor="middle" fill="#475569" font-size="8">IsDefault = false</text>

  <rect x="930" y="198" width="190" height="60" rx="4" fill="#0a0416" stroke="#2d1a5f" stroke-width="1"/>
  <text x="1025" y="218" text-anchor="middle" fill="#8b5cf6" font-size="9" font-weight="700">Partner B</text>
  <text x="1025" y="233" text-anchor="middle" fill="#475569" font-size="8">partner.StripeKey</text>
  <text x="1025" y="248" text-anchor="middle" fill="#475569" font-size="8">IsDefault = false</text>

  <!-- Fee calc -->
  <rect x="700" y="272" width="420" height="50" rx="4" fill="#0a0416" stroke="#2d1a5f" stroke-width="1"/>
  <text x="910" y="291" text-anchor="middle" fill="#c4b5fd" font-size="9" font-weight="700">Fee Calculation (Partner accounts only)</text>
  <text x="910" y="307" text-anchor="middle" fill="#94a3b8" font-size="9">platformFee = (amount × 1.85%) + £0.20</text>
  <text x="910" y="320" text-anchor="middle" fill="#475569" font-size="8">netAmount = (amount − platformFee) × 100 pence</text>

  <!-- Transfer -->
  <rect x="700" y="336" width="420" height="50" rx="4" fill="#0a0416" stroke="#2d1a5f" stroke-width="1"/>
  <text x="910" y="355" text-anchor="middle" fill="#c4b5fd" font-size="9" font-weight="700">Checkout → Transfer to Connected Account</text>
  <text x="910" y="371" text-anchor="middle" fill="#94a3b8" font-size="9">TransferData.Destination = stripeAccountId</text>
  <text x="910" y="384" text-anchor="middle" fill="#475569" font-size="8">TransferData.Amount = netAmount (pence)</text>

  <!-- Webhooks -->
  <rect x="700" y="400" width="420" height="36" rx="4" fill="#1a0a3d" opacity="0.5"/>
  <text x="910" y="414" text-anchor="middle" fill="#9ca3af" font-size="9">Webhook: platform events + connected account events (dual endpoints)</text>
  <text x="910" y="429" text-anchor="middle" fill="#6b7280" font-size="8">Signature verify → update Payment.status → reconcile transfers</text>

  <rect x="630" y="0" width="80" height="628" fill="url(#lf)"/>
  <rect x="1150" y="0" width="50" height="628" fill="url(#rf)"/>
</svg>
