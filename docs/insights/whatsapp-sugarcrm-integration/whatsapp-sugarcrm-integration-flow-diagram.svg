<?xml version="1.0" encoding="UTF-8"?>
<svg width="700" height="1060" viewBox="0 0 700 1060" xmlns="http://www.w3.org/2000/svg" font-family="'Courier New', Courier, monospace">

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#222"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="700" height="1060" fill="#ffffff"/>

  <!-- ─── TITLE ─── -->
  <text x="350" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#111" letter-spacing="0.5">WhatsApp Onboarding Flow — SugarCRM Integration</text>
  <line x1="60" y1="36" x2="640" y2="36" stroke="#222" stroke-width="1"/>

  <!-- ─── NODE 1: START ─── -->
  <rect x="215" y="52" width="270" height="34" rx="17" fill="#222" stroke="#222"/>
  <text x="350" y="64" text-anchor="middle" fill="white" font-size="10" font-weight="bold">START</text>
  <text x="350" y="78" text-anchor="middle" fill="white" font-size="11">Student sends WhatsApp message</text>

  <!-- Arrow 1→2 -->
  <line x1="350" y1="86" x2="350" y2="108" stroke="#222" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ─── NODE 2: PROCESS — Twilio ─── -->
  <rect x="185" y="110" width="330" height="38" rx="4" fill="white" stroke="#222" stroke-width="1.5"/>
  <text x="215" y="126" font-size="9" fill="#888" font-weight="bold">PROCESS</text>
  <text x="350" y="140" text-anchor="middle" fill="#111" font-size="11">Twilio webhook receives message</text>

  <!-- Arrow 2→3 -->
  <line x1="350" y1="148" x2="350" y2="170" stroke="#222" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ─── NODE 3: PROCESS — Lookup ─── -->
  <rect x="185" y="172" width="330" height="38" rx="4" fill="white" stroke="#222" stroke-width="1.5"/>
  <text x="215" y="188" font-size="9" fill="#888" font-weight="bold">PROCESS</text>
  <text x="350" y="202" text-anchor="middle" fill="#111" font-size="11">Lookup student by phone number</text>

  <!-- Arrow 3→4 -->
  <line x1="350" y1="210" x2="350" y2="232" stroke="#222" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ─── NODE 4: DECISION — student exists? ─── -->
  <!-- Diamond: center (350, 258), w=220, h=52 -->
  <polygon points="350,236 460,258 350,280 240,258" fill="white" stroke="#222" stroke-width="1.5"/>
  <text x="350" y="254" text-anchor="middle" fill="#111" font-size="11">Student exists</text>
  <text x="350" y="268" text-anchor="middle" fill="#111" font-size="11">in CRM?</text>

  <!-- YES branch → right → existing flow box -->
  <line x1="460" y1="258" x2="530" y2="258" stroke="#222" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="491" y="251" text-anchor="middle" fill="#444" font-size="10">YES</text>
  <rect x="532" y="241" width="108" height="34" rx="4" fill="#f0f0f0" stroke="#222" stroke-width="1.5"/>
  <text x="586" y="257" text-anchor="middle" fill="#111" font-size="10">Existing</text>
  <text x="586" y="269" text-anchor="middle" fill="#111" font-size="10">follow-up flow</text>

  <!-- NO branch → down -->
  <line x1="350" y1="280" x2="350" y2="302" stroke="#222" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="361" y="296" fill="#444" font-size="10">NO</text>

  <!-- ─── NODE 5: PROCESS — Session ─── -->
  <rect x="185" y="304" width="330" height="38" rx="4" fill="white" stroke="#222" stroke-width="1.5"/>
  <text x="215" y="320" font-size="9" fill="#888" font-weight="bold">PROCESS</text>
  <text x="350" y="334" text-anchor="middle" fill="#111" font-size="11">Load or create conversation session</text>

  <!-- Arrow 5→6 -->
  <line x1="350" y1="342" x2="350" y2="364" stroke="#222" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ─── NODE 6: PROCESS — Send question ─── (loop target) -->
  <!-- Step loop label -->
  <text x="135" y="388" text-anchor="middle" fill="#888" font-size="9" font-style="italic">← loop</text>
  <rect x="185" y="366" width="330" height="38" rx="4" fill="white" stroke="#222" stroke-width="1.5"/>
  <text x="215" y="382" font-size="9" fill="#888" font-weight="bold">PROCESS</text>
  <text x="350" y="396" text-anchor="middle" fill="#111" font-size="11">Send question for current step</text>

  <!-- Arrow 6→7 -->
  <line x1="350" y1="404" x2="350" y2="426" stroke="#222" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ─── NODE 7: PROCESS — student replies ─── -->
  <rect x="185" y="428" width="330" height="38" rx="4" fill="white" stroke="#222" stroke-width="1.5"/>
  <text x="215" y="444" font-size="9" fill="#888" font-weight="bold">PROCESS</text>
  <text x="350" y="458" text-anchor="middle" fill="#111" font-size="11">Student replies</text>

  <!-- Arrow 7→8 -->
  <line x1="350" y1="466" x2="350" y2="488" stroke="#222" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ─── NODE 8: DECISION — valid answer? ─── -->
  <!-- Diamond: center (350, 514), w=220, h=52 -->
  <polygon points="350,492 460,514 350,536 240,514" fill="white" stroke="#222" stroke-width="1.5"/>
  <text x="350" y="510" text-anchor="middle" fill="#111" font-size="11">Answer</text>
  <text x="350" y="524" text-anchor="middle" fill="#111" font-size="11">valid?</text>

  <!-- NO branch → right → error box → loop back up to node 6 -->
  <line x1="460" y1="514" x2="530" y2="514" stroke="#222" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="491" y="507" text-anchor="middle" fill="#444" font-size="10">NO</text>
  <rect x="532" y="498" width="108" height="34" rx="4" fill="#f0f0f0" stroke="#222" stroke-width="1.5"/>
  <text x="586" y="514" text-anchor="middle" fill="#111" font-size="10">Send error</text>
  <text x="586" y="526" text-anchor="middle" fill="#111" font-size="10">+ retry</text>
  <!-- Loop line: right box → up → back to question node -->
  <line x1="640" y1="498" x2="640" y2="385" stroke="#222" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="640" y1="385" x2="516" y2="385" stroke="#222" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

  <!-- YES branch → down -->
  <line x1="350" y1="536" x2="350" y2="558" stroke="#222" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="361" y="552" fill="#444" font-size="10">YES</text>

  <!-- ─── NODE 9: PROCESS — Save answer ─── -->
  <rect x="185" y="560" width="330" height="38" rx="4" fill="white" stroke="#222" stroke-width="1.5"/>
  <text x="215" y="576" font-size="9" fill="#888" font-weight="bold">PROCESS</text>
  <text x="350" y="590" text-anchor="middle" fill="#111" font-size="11">Save answer, advance to next step</text>

  <!-- Arrow 9→10 -->
  <line x1="350" y1="598" x2="350" y2="620" stroke="#222" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ─── NODE 10: DECISION — more questions? ─── -->
  <!-- Diamond: center (350, 646), w=220, h=52 -->
  <polygon points="350,624 460,646 350,668 240,646" fill="white" stroke="#222" stroke-width="1.5"/>
  <text x="350" y="642" text-anchor="middle" fill="#111" font-size="11">More</text>
  <text x="350" y="656" text-anchor="middle" fill="#111" font-size="11">questions?</text>

  <!-- YES branch → left → loop back to node 6 -->
  <line x1="240" y1="646" x2="110" y2="646" stroke="#222" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="172" y="639" text-anchor="middle" fill="#444" font-size="10">YES</text>
  <line x1="110" y1="646" x2="110" y2="385" stroke="#222" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="110" y1="385" x2="184" y2="385" stroke="#222" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

  <!-- NO branch → down -->
  <line x1="350" y1="668" x2="350" y2="690" stroke="#222" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="361" y="684" fill="#444" font-size="10">NO</text>

  <!-- ─── NODE 11: PROCESS — Create student ─── -->
  <rect x="185" y="692" width="330" height="38" rx="4" fill="white" stroke="#222" stroke-width="1.5"/>
  <text x="215" y="708" font-size="9" fill="#888" font-weight="bold">PROCESS</text>
  <text x="350" y="722" text-anchor="middle" fill="#111" font-size="11">Create Student record in SugarCRM</text>

  <!-- Arrow 11→12 -->
  <line x1="350" y1="730" x2="350" y2="752" stroke="#222" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ─── NODE 12: PROCESS — Thank you ─── -->
  <rect x="185" y="754" width="330" height="38" rx="4" fill="white" stroke="#222" stroke-width="1.5"/>
  <text x="215" y="770" font-size="9" fill="#888" font-weight="bold">PROCESS</text>
  <text x="350" y="784" text-anchor="middle" fill="#111" font-size="11">Send thank-you message to student</text>

  <!-- Arrow 12→END -->
  <line x1="350" y1="792" x2="350" y2="814" stroke="#222" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ─── NODE 13: END ─── -->
  <rect x="215" y="816" width="270" height="34" rx="17" fill="#222" stroke="#222"/>
  <text x="350" y="828" text-anchor="middle" fill="white" font-size="10" font-weight="bold">END</text>
  <text x="350" y="842" text-anchor="middle" fill="white" font-size="11">Student created, session complete</text>

  <!-- ─── LEGEND ─── -->
  <rect x="60" y="880" width="580" height="140" rx="6" fill="#fafafa" stroke="#ddd" stroke-width="1"/>
  <text x="350" y="900" text-anchor="middle" font-size="11" font-weight="bold" fill="#111">LEGEND</text>

  <!-- START/END -->
  <rect x="90" y="912" width="100" height="22" rx="11" fill="#222"/>
  <text x="140" y="927" text-anchor="middle" fill="white" font-size="10">START / END</text>

  <!-- PROCESS -->
  <rect x="90" y="944" width="100" height="22" rx="3" fill="white" stroke="#222" stroke-width="1.5"/>
  <text x="140" y="959" text-anchor="middle" fill="#111" font-size="10">PROCESS</text>

  <!-- DECISION -->
  <polygon points="290,955 340,944 390,955 340,966" fill="white" stroke="#222" stroke-width="1.5"/>
  <text x="340" y="959" text-anchor="middle" fill="#111" font-size="10">DECISION</text>

  <!-- LOOP -->
  <line x1="450" y1="955" x2="520" y2="955" stroke="#222" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="540" y="959" fill="#111" font-size="10">Loop / retry</text>

  <!-- Descriptions -->
  <text x="90" y="992" font-size="10" fill="#555">Terminal states (rounded pill)</text>
  <text x="90" y="1008" font-size="10" fill="#555">Action or system operation</text>
  <text x="290" y="992" font-size="10" fill="#555">Branch point (YES / NO)</text>
  <text x="450" y="992" font-size="10" fill="#555">Feedback loop</text>

  <!-- Footer -->
  <text x="350" y="1048" text-anchor="middle" font-size="10" fill="#aaa">fac4fac · SugarCRM + Twilio WhatsApp Integration</text>

</svg>
