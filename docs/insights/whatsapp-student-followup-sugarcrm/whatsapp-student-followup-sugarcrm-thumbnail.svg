<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="628" viewBox="0 0 1200 628" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif">

  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="0.3" opacity="0.06"/>
    </pattern>
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4a90e2;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#1a4fa0;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="leftFade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0d1117;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#0d1117;stop-opacity:0"/>
    </linearGradient>
    <linearGradient id="rightFade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0d1117;stop-opacity:0"/>
      <stop offset="100%" style="stop-color:#0d1117;stop-opacity:1"/>
    </linearGradient>
    <marker id="arrowBlue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4a90e2"/>
    </marker>
    <marker id="arrowBlueR" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto">
      <polygon points="8 0, 0 3, 8 6" fill="#4a90e2"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="628" fill="#0d1117"/>
  <rect width="1200" height="628" fill="url(#grid)"/>

  <!-- Blue accent bar left -->
  <rect x="0" y="0" width="6" height="628" fill="url(#blueGlow)"/>

  <!-- Glow blob -->
  <ellipse cx="880" cy="314" rx="340" ry="270" fill="#4a90e2" opacity="0.04"/>

  <!-- ─── LEFT: TEXT ─── -->
  <rect x="60" y="90" width="150" height="28" rx="14" fill="#4a90e2" opacity="0.15"/>
  <text x="135" y="109" text-anchor="middle" fill="#4a90e2" font-size="13" font-weight="600" letter-spacing="1">INSIGHTS</text>

  <text x="60" y="192" fill="#ffffff" font-size="50" font-weight="800" letter-spacing="-1">Two-Way WhatsApp</text>
  <text x="60" y="252" fill="#ffffff" font-size="50" font-weight="800" letter-spacing="-1">Messaging for</text>
  <text x="60" y="312" fill="#ffffff" font-size="50" font-weight="800" letter-spacing="-1">
    <tspan fill="#4a90e2">Existing Students</tspan>
  </text>
  <text x="60" y="360" fill="#ffffff" font-size="50" font-weight="800" letter-spacing="-1">in SugarCRM</text>

  <line x1="60" y1="386" x2="480" y2="386" stroke="#4a90e2" stroke-width="2" opacity="0.5"/>
  <text x="60" y="418" fill="#aaaaaa" font-size="17">Templates · Delivery tracking · Audio · Bulk send</text>

  <rect x="60" y="444" width="130" height="28" rx="14" fill="#1a2230" stroke="#333" stroke-width="1"/>
  <text x="125" y="463" text-anchor="middle" fill="#888" font-size="12">CRM Integration</text>
  <rect x="202" y="444" width="100" height="28" rx="14" fill="#1a2230" stroke="#333" stroke-width="1"/>
  <text x="252" y="463" text-anchor="middle" fill="#888" font-size="12">WhatsApp</text>
  <rect x="314" y="444" width="80" height="28" rx="14" fill="#1a2230" stroke="#333" stroke-width="1"/>
  <text x="354" y="463" text-anchor="middle" fill="#888" font-size="12">Twilio</text>

  <text x="60" y="556" fill="#444" font-size="14">northbeam-tech.com/insights</text>

  <!-- ─── RIGHT: VISUAL — Two-way chat ─── -->

  <!-- SugarCRM panel (left side of visual) -->
  <rect x="680" y="80" width="200" height="380" rx="10" fill="#141b27" stroke="#2a3550" stroke-width="1.5"/>
  <!-- Header bar -->
  <rect x="680" y="80" width="200" height="36" rx="10" fill="#1e2d4a"/>
  <rect x="680" y="96" width="200" height="20" fill="#1e2d4a"/>
  <rect x="694" y="88" width="16" height="16" rx="8" fill="#4a90e2"/>
  <text x="717" y="100" fill="white" font-size="10" font-weight="600">SugarCRM</text>
  <text x="717" y="112" fill="#aaa" font-size="9">Ahmed Al-Rashid</text>

  <!-- Chat messages in SugarCRM -->
  <!-- Sent (right aligned) -->
  <rect x="730" y="128" width="136" height="28" rx="8" fill="#4a90e2"/>
  <text x="798" y="142" text-anchor="middle" fill="white" font-size="9" font-weight="600">Hello Ahmed! Your</text>
  <text x="798" y="153" text-anchor="middle" fill="white" font-size="9">interview is tomorrow.</text>

  <!-- Received (left aligned) -->
  <rect x="688" y="168" width="120" height="22" rx="8" fill="#1e2d4a" stroke="#2a3550" stroke-width="1"/>
  <text x="698" y="183" fill="#ddd" font-size="9">Thanks! What time?</text>

  <!-- Sent -->
  <rect x="730" y="202" width="136" height="22" rx="8" fill="#4a90e2"/>
  <text x="798" y="217" text-anchor="middle" fill="white" font-size="9">At 10:00 AM, room 3.</text>

  <!-- Received -->
  <rect x="688" y="236" width="120" height="22" rx="8" fill="#1e2d4a" stroke="#2a3550" stroke-width="1"/>
  <text x="698" y="251" fill="#ddd" font-size="9">Perfect, I'll be there!</text>

  <!-- Sent template -->
  <rect x="710" y="270" width="156" height="34" rx="8" fill="#4a90e2"/>
  <text x="788" y="284" text-anchor="middle" fill="white" font-size="8">📋 Template: Reminder</text>
  <text x="788" y="296" text-anchor="middle" fill="white" font-size="8">Hi {student_name}, see you...</text>

  <!-- Received audio -->
  <rect x="688" y="316" width="130" height="26" rx="8" fill="#1e2d4a" stroke="#2a3550" stroke-width="1"/>
  <text x="698" y="328" fill="#ddd" font-size="9">🎵 Voice message</text>
  <text x="698" y="340" fill="#888" font-size="8">▶ 0:12</text>

  <!-- Input bar -->
  <rect x="688" y="356" width="180" height="28" rx="6" fill="#0d1420" stroke="#2a3550" stroke-width="1"/>
  <text x="698" y="374" fill="#555" font-size="9">Type a message...</text>
  <rect x="852" y="360" width="12" height="20" rx="3" fill="#4a90e2"/>

  <!-- Status badges -->
  <rect x="688" y="396" width="54" height="18" rx="9" fill="#0d3320"/>
  <text x="715" y="409" text-anchor="middle" fill="#25D366" font-size="8">✓ Sent</text>
  <rect x="750" y="396" width="70" height="18" rx="9" fill="#0d2040"/>
  <text x="785" y="409" text-anchor="middle" fill="#4a90e2" font-size="8">✓ Delivered</text>
  <rect x="828" y="396" width="44" height="18" rx="9" fill="#1a1a1a"/>
  <text x="850" y="409" text-anchor="middle" fill="#888" font-size="8">Read</text>

  <!-- Two-way arrows between SugarCRM and Phone -->
  <line x1="884" y1="200" x2="940" y2="200" stroke="#4a90e2" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrowBlue)"/>
  <line x1="940" y1="240" x2="884" y2="240" stroke="#25D366" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrowBlueR)"/>
  <text x="912" y="196" text-anchor="middle" fill="#4a90e2" font-size="9">send</text>
  <text x="912" y="256" text-anchor="middle" fill="#25D366" font-size="9">reply</text>

  <!-- WhatsApp phone (right side of visual) -->
  <rect x="942" y="100" width="170" height="300" rx="20" fill="#1a1a2e" stroke="#333" stroke-width="1.5"/>
  <rect x="954" y="120" width="146" height="260" rx="10" fill="#111820"/>
  <!-- Notch -->
  <rect x="1005" y="124" width="28" height="6" rx="3" fill="#333"/>
  <!-- WA header -->
  <rect x="954" y="130" width="146" height="28" rx="4" fill="#1e2d1e"/>
  <rect x="960" y="136" width="16" height="16" rx="8" fill="#25D366"/>
  <text x="982" y="146" fill="white" font-size="9" font-weight="600">Ahmed</text>
  <text x="982" y="156" fill="#aaa" font-size="8">online</text>

  <!-- Phone chat bubbles matching SugarCRM -->
  <rect x="1010" y="170" width="82" height="28" rx="8" fill="#005c4b"/>
  <text x="1051" y="183" text-anchor="middle" fill="white" font-size="8">Hello Ahmed! Your</text>
  <text x="1051" y="193" text-anchor="middle" fill="white" font-size="8">interview is tomorrow</text>

  <rect x="960" y="208" width="96" height="18" rx="8" fill="#1e2d1e"/>
  <text x="1008" y="220" text-anchor="middle" fill="#ddd" font-size="8">Thanks! What time?</text>

  <rect x="1010" y="236" width="82" height="18" rx="8" fill="#005c4b"/>
  <text x="1051" y="248" text-anchor="middle" fill="white" font-size="8">At 10:00 AM, room 3.</text>

  <rect x="960" y="264" width="96" height="18" rx="8" fill="#1e2d1e"/>
  <text x="1008" y="276" text-anchor="middle" fill="#ddd" font-size="8">Perfect, I'll be there!</text>

  <rect x="1010" y="292" width="82" height="28" rx="8" fill="#005c4b"/>
  <text x="1051" y="305" text-anchor="middle" fill="white" font-size="8">📋 Hi Ahmed,</text>
  <text x="1051" y="317" text-anchor="middle" fill="white" font-size="8">see you tomorrow!</text>

  <rect x="960" y="330" width="96" height="26" rx="8" fill="#1e2d1e"/>
  <text x="1008" y="341" text-anchor="middle" fill="#ddd" font-size="8">🎵 Voice message</text>
  <text x="1008" y="352" text-anchor="middle" fill="#888" font-size="7">▶ 0:12</text>

  <!-- Fades -->
  <rect x="640" y="0" width="60" height="628" fill="url(#leftFade)"/>
  <rect x="1150" y="0" width="50" height="628" fill="url(#rightFade)"/>

  <!-- Bottom accent -->
  <rect x="0" y="622" width="1200" height="6" fill="url(#blueGlow)"/>

</svg>
